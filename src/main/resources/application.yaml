faf:
  self-url: ${SELF_URL:http://localhost:8080}
  environment: ${FAF_ENVIRONMENT}
  real-ip-header: ${REAL_IP_HEADER:X-Real-Ip}
  hydra-base-url: ${HYDRA_BASE_ADMIN_URL:http://localhost:4445}
  account:
    password-reset-url: ${faf.self-url}/recover-account
    register-account-url: ${faf.self-url}/register
    account-link-url: ${ACCOUNT_LINK_URL:`https://www.faforever.com/account/link`}
    registration:
      activation-url-format: ${faf.self-url}/register/activate?token=%s
      subject: ${REGISTRATION_EMAIL_SUBJECT:FAF user registration}
      activation-mail-template-path: ${ACCOUNT_ACTIVATION_MAIL_TEMPLATE_PATH:/config/mail/account-activation.html}
      welcome-subject: ${WELCOME_MAIL_SUBJECT:Welcome to FAF}
      email-taken-subject: ${EMAIL_TAKEN_SUBJECT:Account exists notice}
      welcome-mail-template-path: ${WELCOME_MAIL_TEMPLATE_PATH:/config/mail/welcome-to-faf.html}
      email-taken-mail-template-path: ${EMAIL_TAKEN_MAIL_TEMPLATE_PATH:/config/mail/email-taken.html}
      terms-of-service-url: ${FAF_TERMS_OF_SERVICE:https://faforever.com/tos}
      privacy-statement-url: ${FAF_PRIVACY_STATEMENT:https://faforever.com/privacy}
      rules-url: ${FAF_RULES:https://faforever.com/rules}
    password-reset:
      password-reset-url-format: ${faf.self-url}/recover-account/set-password?token=%s
      password-reset-initiate-email-url-format: ${faf.self-url}/recover-account/email?identifier=%s
      subject: ${PASSWORD_RESET_EMAIL_SUBJECT:FAF password reset}
      mail-template-path: ${PASSWORD_RESET_MAIL_TEMPLATE_PATH:/config/mail/password-reset.html}
    email-change:
      confirmation-url-format: ${faf.self-url}/ucp/email/confirm?token=%s
      subject: ${EMAIL_CHANGE_SUBJECT:Confirm your FAF email change}
      mail-template-path: ${EMAIL_CHANGE_MAIL_TEMPLATE_PATH:/config/mail/email-change-confirmation.html}
      notification-subject: ${EMAIL_CHANGE_NOTIFICATION_SUBJECT:Your FAF email address was changed}
      notification-mail-template-path: ${EMAIL_CHANGE_NOTIFICATION_MAIL_TEMPLATE_PATH:/config/mail/email-change-notification.html}
    account-deletion:
      external-consumers-enabled: ${ACCOUNT_DELETION_EXTERNAL_CONSUMERS_ENABLED:true}
      confirmation-url-format: ${faf.self-url}/ucp/delete-account/confirm?token=%s
      subject: ${ACCOUNT_DELETION_SUBJECT:Confirm your FAF account deletion}
      mail-template-path: ${ACCOUNT_DELETION_MAIL_TEMPLATE_PATH:/config/mail/account-deletion-confirmation.html}
      notification-subject: ${ACCOUNT_DELETION_NOTIFICATION_SUBJECT:Your FAF account was deleted}
      notification-mail-template-path: ${ACCOUNT_DELETION_NOTIFICATION_MAIL_TEMPLATE_PATH:/config/mail/account-deletion-notification.html}
    password-change:
      notification-subject: ${PASSWORD_CHANGE_NOTIFICATION_SUBJECT:FAF password changed}
      notification-mail-template-path: ${PASSWORD_CHANGE_NOTIFICATION_MAIL_TEMPLATE_PATH:/config/mail/password-change-notification.html}
    username:
      minimum-days-between-username-change: ${MIN_DAYS_BETWEEN_NAME_CHANGE:30}
      username-reservation-time-in-months: ${NAME_RESERVATION_MONTHS:6}
  altcha:
    enabled: ${ALTCHA_ENABLED:false}
    hmac-key: ${ALTCHA_HMAC_KEY}
  jwt:
    secret: ${JWT_SECRET:banana}
    hmac:
      message: ${JWT_HMAC_MESSAGE:helloFaf}
      secret: ${JWT_HMAC_SECRET:banana}
  lobby:
    secret: ${LOBBY_SECRET:banana}
    access-uri: ${LOBBY_URL:ws://localhost:8003}
    access-param: ${LOBBY_PARAM:verify}
  replay:
    secret: ${REPLAY_SECRET:banana}
    access-uri: ${REPLAY_URL:ws://localhost:8004}
    access-param: ${REPLAY_PARAM:verify}
  chat:
    secret: ${CHAT_ACCESS_SECRET:banana}
    access-uri: ${CHAT_URL:ws://localhost:8005}
    access-param: ${CHAT_ACCESS_PARAM:verify}
  irc:
    secret: ${IRC_SECRET:banana}
    token-ttl: ${IRC_TOKEN_TTL:300}
  steam:
    realm: ${faf.self-url}
    api-key: ${STEAM_API_KEY:banana}
    link-to-steam-redirect-url-format: ${faf.self-url}/ucp/linking/confirm?token=%s
  nodebb:
    read-api-url: ${NODEBB_READ_API_URL:https://forum.faforever.com/api}
    write-api-url: ${NODEBB_WRITE_API_URL:https://forum.faforever.com/api/v3}
    admin-token: ${NODEBB_ADMIN_TOKEN}
  wikijs:
    graphql-url: ${WIKIJS_GRAPHQL_URL:https://wiki.faforever.com/graphql}
    token: ${WIKIJS_TOKEN}
    replace-user-id: ${WIKIJS_REPLACE_USER_ID:42}
  gog:
    token-format: "{{FAF:%s}}"
    forged-alliance-product-id: "1444785261"

mailjet:
  api-key: ${MAILJET_API_KEY}
  api-secret: ${MAILJET_API_SECRET}

security:
  failed-login-account-threshold: ${FAILED_LOGIN_ACCOUNT_THRESHOLD:5}
  failed-login-attempt-threshold: ${FAILED_LOGIN_ATTEMPT_THRESHOLD:10}
  failed-login-throttling-minutes: ${FAILED_LOGIN_THROTTLING_MINUTES:5}
  failed-login-days-to-check: ${FAILED_LOGIN_DAYS_TO_CHECK:1}

rabbitmq-host: ${RABBITMQ_HOST:localhost}
rabbitmq-port: ${RABBITMQ_PORT:5672}
rabbitmq-username: ${RABBITMQ_USERNAME:guest}
rabbitmq-password: ${RABBITMQ_PASSWORD:guest}

quarkus:
  log:
    level: INFO
  rest-client:
    faf-ory-hydra:
      url: ${HYDRA_BASE_ADMIN_URL:http://localhost:4445}
    steam-api:
      url: https://api.steampowered.com
      connect-timeout: 10000
      read-timeout: 10000
    gog-api:
      url: https://www.gog.com
      connect-timeout: 10000
      read-timeout: 10000
  mailer:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:0}
    username: ${MAIL_USERNAME:mailer}
    password: ${MAIL_PASSWORD:banana}
    start-tls: OPTIONAL
    login: REQUIRED
    from: ${EMAIL_FROM_ADDRESS:admin@faforever.com}
    mock: ${MOCK_EMAIL:true}
  devservices:
    enabled: false
  datasource:
    db-kind: mariadb
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:banana}
    jdbc:
      url: ${DB_URL:jdbc:mariadb://localhost:3306/faf?ssl=false}
  application:
    name: faf-user-service
  hibernate-orm:
    mapping:
      format:
        # needed for AccountRequest.data
        # it wants us to pick a JSON mapper
        # ignore uses the default in Hibernate:
        # https://github.com/quarkusio/quarkus/wiki/Migration-Guide-3.26#jsonxml-mapping
        global: ignore
  management:
    enabled: true

"%dev":
  quarkus:
    live-reload:
      instrumentation: true
    http:
      cors:
        origins: "/.*/"
    mailer:
      mock: true
    log:
      category:
        "com.faforever":
          level: DEBUG
  faf:
    environment: ${FAF_ENVIRONMENT:dev}
    account:
      registration:
        activation-mail-template-path: ${ACCOUNT_ACTIVATION_MAIL_TEMPLATE_PATH:src/main/mjml/dummy/test-account-activation.html}
        welcome-mail-template-path: ${WELCOME_MAIL_TEMPLATE_PATH:src/main/mjml/dummy/test-welcome-to-faf.html}
        email-taken-mail-template-path: ${EMAIL_TAKEN_MAIL_TEMPLATE_PATH:src/main/mjml/dummy/test-email-taken.html}
      password-reset:
        mail-template-path: ${PASSWORD_RESET_MAIL_TEMPLATE_PATH:src/main/mjml/dummy/test-password-reset.html}
      email-change:
        mail-template-path: ${EMAIL_CHANGE_MAIL_TEMPLATE_PATH:src/main/mjml/dummy/test-email-change-confirmation.html}
        notification-mail-template-path: ${EMAIL_CHANGE_NOTIFICATION_MAIL_TEMPLATE_PATH:src/main/mjml/dummy/test-email-change-notification.html}
      password-change:
        notification-mail-template-path: ${PASSWORD_CHANGE_NOTIFICATION_MAIL_TEMPLATE_PATH:src/main/mjml/dummy/test-password-change-notification.html}
      account-deletion:
        external-consumers-enabled: false
        mail-template-path: ${ACCOUNT_DELETION_MAIL_TEMPLATE_PATH:src/main/mjml/dummy/test-account-deletion-confirmation.html}
        notification-mail-template-path: ${ACCOUNT_DELETION_NOTIFICATION_MAIL_TEMPLATE_PATH:src/main/mjml/dummy/test-account-deletion-notification.html}
    altcha:
      enabled: true
      hmac-key: dev-hmac-key-not-for-production
    nodebb:
      read-api-url: ${NODEBB_READ_API_URL:http://localhost:9999/nodebb-read-disabled}
      write-api-url: ${NODEBB_WRITE_API_URL:http://localhost:9999/nodebb-write-disabled}
      admin-token: ${NODEBB_ADMIN_TOKEN:dev-nodebb-token-do-not-use}
    wikijs:
      graphql-url: ${WIKIJS_GRAPHQL_URL:http://localhost:9999/wikijs-disabled}
      token: ${WIKIJS_TOKEN:dev-wikijs-token-do-not-use}
      replace-user-id: ${WIKIJS_REPLACE_USER_ID:42}
    irc:
      fixed:
        users:
          test-user: banana

mp:
  messaging:
    outgoing:
      account-deletion-events:
        connector: smallrye-rabbitmq
        exchange:
          name: lobby
          type: topic
          durable: true
        default-routing-key: request.user.delete

    incoming:
      account-deletion-nodebb:
        connector: smallrye-rabbitmq
        queue:
          name: account-deletion-nodebb
          durable: true
        exchange:
          name: lobby
          type: topic
          durable: true
        routing-keys: request.user.delete
        auto-bind-dlq: true
        dead-letter-exchange: DLX
        dead-letter-exchange-type: direct
        dlx:
          declare: true

      account-deletion-wikijs:
        connector: smallrye-rabbitmq
        queue:
          name: account-deletion-wikijs
          durable: true
        exchange:
          name: lobby
          type: topic
          durable: true
        routing-keys: request.user.delete
        auto-bind-dlq: true
        dead-letter-exchange: DLX
        dead-letter-exchange-type: direct
        dlx:
          declare: true

      account-deletion-email-notification:
        connector: smallrye-rabbitmq
        queue:
          name: account-deletion-email-notification
          durable: true
        exchange:
          name: lobby
          type: topic
          durable: true
        routing-keys: request.user.delete
        auto-bind-dlq: true
        dead-letter-exchange: DLX
        dead-letter-exchange-type: direct
        dlx:
          declare: true

  jwt:
    verify:
      issuer: ${HYDRA_TOKEN_ISSUER:http://faf-ory-hydra:4444}
      key-format: JWKS
      publickey:
        location: ${HYDRA_JWKS_URL:http://localhost:4444/.well-known/jwks.json}
